name: Diagnostico composicion (one-off)

# Diagnostico de composicion de puntos ODEPA (tipo de punto de monitoreo) en
# los ingredientes de los 4 indices. Solo lectura: SOLO workflow_dispatch (sin
# cron), no toca Pages ni usa el grupo de concurrencia "pages", no commitea
# nada y no publica nada. Los CSV quedan como artifact del run; el detalle y el
# resumen, en el log del job.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clonar repo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy requests

      # sin red: datos sinteticos con un cambio de muestra conocido
      - name: Prueba sintetica
        run: python diagnostico_composicion.py --prueba

      - name: Ejecutar diagnostico
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        # Sin copia del log en el artifact: si el Banco Central falla, indices.py
        # imprime el error de requests, que trae la URL con BCCH_USER y
        # BCCH_PASS. GitHub los enmascara en el log del job, no en un archivo.
        run: python diagnostico_composicion.py

      - name: Subir resultados como artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostico_composicion
          path: |
            diagnostico_composicion_semanal.csv
            diagnostico_composicion_anual.csv
            diagnostico_composicion_indices.csv
          retention-days: 30
