name: Actualizar indices costo de vida

# Corre todos los viernes 16:30 UTC (~12:30 Chile) y permite ejecucion manual.
# ODEPA publica los viernes 12:00, dejamos margen.
on:
  schedule:
    - cron: "30 16 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy requests

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Calcular indices
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: python indices.py

      - name: Validar contra sitio desplegado
        run: python validar.py

      - name: Generar sitio
        run: |
          python build_site.py
          mkdir -p public
          cp index.html public/index.html
          cp indices.json public/indices.json
          cp resumen.json public/resumen.json
          cp og.png public/og.png
          cp robots.txt public/robots.txt
          cp sitemap.xml public/sitemap.xml
          cp metodologia.html public/metodologia.html
          cp acerca.html public/acerca.html
          cp contacto.html public/contacto.html
          cp terminos.html public/terminos.html
          cp privacidad.html public/privacidad.html
          cp 404.html public/404.html
          cp -r productos public/productos

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
