name: Actualizar indices costo de vida

# Corre los viernes a las 15:30, 17:00 y 19:00 UTC (en Chile, entre las 11:30
# y las 16:00 según el horario de verano), con dos respaldos el viernes en la
# tarde (20:47 y 22:13 UTC: 17:47 y 19:13 en el verano de Chile, una hora
# antes en invierno) y tres el sábado en la mañana (12:23, 13:00 y 14:41 UTC:
# 9:23, 10:00 y 11:41 en verano). Los respaldos nuevos van en minutos
# distintos de :00 y :30, cuando GitHub atrasa o se salta los programados.
# También a mano.
#
# Cada corrida se puede repetir sin efecto:
# - el job revisar (publicacion.py revisar) lee el resumen.json publicado y,
#   en una corrida programada, si la semana que ODEPA publica este viernes ya
#   está, el workflow no arma ni publica nada y sale en verde. Una corrida a
#   mano siempre arma;
# - si arma y ODEPA todavía no publica, publica lo mismo que había (y desde el
#   viernes a las 17:00 de Chile, con el aviso "Sin datos nuevos" de
#   build_site.py: ODEPA_HORA);
# - el paso "Conteos contra la referencia" (publicacion.py conteos) corta el
#   build, sin deploy y con el correo de GitHub, si los conteos de los 4
#   índices no son los de la referencia publicada más 1 (o iguales, si la
#   semana no avanzó). Si se perdió una semana entera, se corre a mano con
#   aceptar_salto.
on:
  schedule:
    - cron: "30 15 * * 5"
    - cron: "0 17 * * 5"
    - cron: "0 19 * * 5"
    - cron: "47 20 * * 5"
    - cron: "13 22 * * 5"
    - cron: "23 12 * * 6"
    - cron: "0 13 * * 6"
    - cron: "41 14 * * 6"
  workflow_dispatch:
    inputs:
      aceptar_salto:
        description: "Aceptar que la semana avance más de una (solo si se perdió una semana entera)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Una corrida a la vez, sin cancelar la que está en curso: la que llega
# mientras otra corre espera (si llega otra más, reemplaza a la que esperaba)
# y, cuando le toca, el job revisar ve la semana ya publicada y termina en
# segundos. Así un respaldo atrasado nunca corta a la corrida que estaba por
# publicar. Nunca queda una publicación a medias: nada se commitea al repo y
# lo único que publica es el job deploy (actions/deploy-pages), que despliega
# el artefacto completo de su build. GitHub Pages cambia de versión de una
# vez: si una corrida se cancela a mano antes del deploy queda la versión
# anterior, y si se cancela durante el deploy, la acción cancela ese
# despliegue y también queda la anterior.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ¿Hay algo que publicar? Solo lee el resumen.json publicado, con el Python
  # del runner y sin dependencias. construir=false solo en una corrida
  # programada con la semana ya publicada; ante cualquier duda, true.
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      construir: ${{ steps.semana.outputs.construir }}
    steps:
      - name: Clonar publicacion.py
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: publicacion.py
          sparse-checkout-cone-mode: false

      - name: Semana ya publicada
        id: semana
        run: python3 publicacion.py revisar

  build:
    needs: revisar
    if: ${{ needs.revisar.outputs.construir == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      libreria: ${{ steps.tv.outputs.libreria }}
      aviso: ${{ steps.conteos.outputs.aviso }}
    steps:
      # Sin credenciales persistidas: checkout dejaría en .git/config un
      # includeIf con el GITHUB_TOKEN como http.extraheader, y git lo sumaría
      # al encabezado de TV_LIBRARY_TOKEN (GitHub responde 400 por
      # "Duplicate header: Authorization"). Nada del build usa git después.
      - name: Clonar repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Licencia TradingView: la librería Advanced Charts vive solo en el sitio
      # publicado, nunca en este repo. Se clona del repo privado fuera del árbol
      # (RUNNER_TEMP), en el tag fijado abajo (o el que fije la variable
      # TV_LIBRARY_TAG del repo; con los dos vacíos, el tag vX.Y.Z más alto),
      # y se copia solo charting_library/ a public/charting_library/. git
      # corre desde RUNNER_TEMP, fuera del checkout, para no leer su
      # .git/config; por eso public/ va con ruta absoluta. Si algo falla, el
      # build sigue sin ella (las páginas dibujan con Lightweight Charts) y el
      # job aviso-libreria falla después del deploy para que llegue el correo.
      - name: Librería TradingView
        id: tv
        shell: bash
        env:
          TV_LIBRARY_TOKEN: ${{ secrets.TV_LIBRARY_TOKEN }}
          # v32.2.0: la primera versión publicada en el sitio (1 de octubre de 2026)
          TV_LIBRARY_TAG: ${{ vars.TV_LIBRARY_TAG || 'v32.2.0' }}
        run: |
          set -uo pipefail
          DEST="$RUNNER_TEMP/tv"
          PUBLIC="$GITHUB_WORKSPACE/public"
          fallar() {
            echo "::warning::No se pudo descargar la librería de TradingView: $1"
            echo "libreria=falla" >> "$GITHUB_OUTPUT"
            rm -rf "$DEST" "$PUBLIC/charting_library"
            exit 0
          }
          cd "$RUNNER_TEMP" || fallar "no se pudo entrar a RUNNER_TEMP"
          [ -n "$TV_LIBRARY_TOKEN" ] || fallar "falta el secreto TV_LIBRARY_TOKEN"
          # el token va en un encabezado (nunca en la URL ni en los argumentos)
          # y git no lee otra configuración: ni la del sistema ni la global, y
          # la del checkout tampoco, porque git corre fuera de él
          auth=$(printf 'x-access-token:%s' "$TV_LIBRARY_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          # si GitHub deja de responder, git corta al minuto (no a las 6 horas del job)
          export GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=advice.detachedHead GIT_CONFIG_VALUE_1=false
          REPO=https://github.com/tradingview/charting_library.git
          tag="$TV_LIBRARY_TAG"
          if [ -z "$tag" ]; then
            refs=$(git ls-remote --tags --refs "$REPO") || fallar "no se pudieron leer los tags del repo"
            # el X.Y.Z o vX.Y.Z más alto, sin -beta ni -rc, ordenado por el
            # número sin la v. Nada en esta tubería falla si no hay tags:
            # Actions corre el paso con -e -o pipefail y tiene que llegar a fallar()
            tag=$(printf '%s\n' "$refs" \
                  | sed -nE 's#.*refs/tags/(v?)([0-9]+(\.[0-9]+)*)$#\2 \1\2#p' \
                  | sort -V | tail -n 1 | cut -d' ' -f2)
            [ -n "$tag" ] || fallar "el repo no tiene tags de versión estable"
          fi
          git clone --quiet --depth 1 --branch "$tag" "$REPO" "$DEST" \
            || fallar "no se pudo clonar el tag $tag"
          [ -f "$DEST/charting_library/charting_library.standalone.js" ] \
            || fallar "el tag $tag no trae charting_library/charting_library.standalone.js"
          mkdir -p "$PUBLIC" || fallar "no se pudo crear la carpeta public"
          cp -r "$DEST/charting_library" "$PUBLIC/charting_library" \
            || fallar "no se pudo copiar charting_library/"
          rm -rf "$DEST"
          echo "libreria=ok" >> "$GITHUB_OUTPUT"
          echo "Librería TradingView $tag en public/charting_library/"
          echo "Librería TradingView: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pillow: las tarjetas og:image que dibuja build_site.py (tarjetas.py)
      - name: Instalar dependencias
        run: pip install pandas numpy requests pillow

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Calcular indices
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        # -u: el log muestra el avance año por año mientras baja ODEPA (sin
        # él Python guarda la salida hasta el final y no se ve dónde se pega)
        run: python -u indices.py

      # La semana y los conteos de los 4 índices contra el resumen.json
      # publicado: la referencia más 1 si la semana avanzó, iguales si no.
      # Si no cuadran, exit 1: no hay deploy y llega el correo. aceptar_salto
      # (solo a mano) deja pasar más de una semana nueva
      - name: Conteos contra la referencia
        id: conteos
        env:
          ACEPTAR_SALTO: ${{ inputs.aceptar_salto }}
        run: python publicacion.py conteos

      - name: Validar contra sitio desplegado
        run: python validar.py

      # La UF de cada lunes desde 2008 (datos/uf.json), que se publica con
      # datos/ aunque el sitio ya no la muestra: Banco Central con mindicador
      # de respaldo. uf.py nunca corta el build: si no obtiene la UF deja un
      # aviso y el sitio se publica sin datos/uf.json
      - name: UF
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: python uf.py

      - name: Generar sitio
        run: |
          python build_site.py
          mkdir -p public
          cp index.html public/index.html
          cp graficos.html public/graficos.html
          cp prueba-graficos.html public/prueba-graficos.html
          cp carestia-tv.js public/carestia-tv.js
          cp carestia-tv.css public/carestia-tv.css
          cp carestia-ficha.js public/carestia-ficha.js
          cp indices.json public/indices.json
          cp resumen.json public/resumen.json
          cp og.png public/og.png
          cp apple-touch-icon.png public/apple-touch-icon.png
          cp robots.txt public/robots.txt
          cp sitemap.xml public/sitemap.xml
          cp metodologia.html public/metodologia.html
          cp acerca.html public/acerca.html
          cp novedades.html public/novedades.html
          cp contacto.html public/contacto.html
          cp terminos.html public/terminos.html
          cp privacidad.html public/privacidad.html
          cp prensa.html public/prensa.html
          cp compras.html public/compras.html
          cp 404.html public/404.html
          cp -r productos public/productos
          cp -r indices public/indices
          cp -r canastas public/canastas
          cp -r og public/og
          cp -r datos public/datos

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ODEPA no publicó la semana que ya debía estar: el sitio ya quedó publicado
  # con el aviso "Sin datos nuevos", pero el run termina en rojo para que
  # llegue el correo. Los conteos sí cuadraron (iguales a la referencia).
  aviso-odepa:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.outputs.aviso == 'odepa' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Avisar que ODEPA no publicó
        run: |
          echo "::error::ODEPA no publicó la semana de este viernes"
          {
            echo "## ODEPA no publicó la semana de este viernes"
            echo "El sitio se publicó con el aviso «Sin datos nuevos de ODEPA esta semana»."
            echo "Los horarios de respaldo vuelven a intentar; el detalle está en el paso «Conteos contra la referencia» del job build."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # La librería no se pudo descargar: el sitio ya quedó publicado (con
  # Lightweight Charts), pero el run termina en rojo para que llegue el correo.
  aviso-libreria:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.outputs.libreria == 'falla' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Avisar que falta la librería
        run: |
          echo "::error::No se pudo descargar la librería de TradingView"
          {
            echo "## No se pudo descargar la librería de TradingView"
            echo "El sitio se publicó sin ella y los gráficos usan Lightweight Charts."
            echo "El motivo está en el paso «Librería TradingView» del job build."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
