name: Grafico Asado FP

# Genera el grafico del Indice Asado para el factsheet de Fiestas Patrias.
# Solo manual (Run workflow). Aislado de Pages: no publica nada, deja el
# PNG como artifact descargable.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  grafico:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests matplotlib

      - name: Generar grafico
        run: python grafico_asado_dieciochero.py

      - name: Subir PNG como artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafico_asado
          path: grafico_asado.png
