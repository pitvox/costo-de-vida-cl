name: Analisis Libertadores (one-off)

# Analisis editorial manual sobre el cierre del Paso Los Libertadores.
# SOLO workflow_dispatch (sin cron). No toca Pages ni usa el grupo de
# concurrencia "pages": no puede interferir con el deploy del sitio.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analisis:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy requests matplotlib

      - name: Ejecutar analisis
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        # La tabla queda en el log del job, sin copia en el artifact: si el
        # Banco Central falla, indices.py imprime el error de requests, que trae
        # la URL con BCCH_USER y BCCH_PASS. GitHub los enmascara en el log del
        # job, no en un archivo.
        run: python analisis_libertadores.py

      - name: Subir resultados como artifact
        uses: actions/upload-artifact@v7
        with:
          name: libertadores
          path: libertadores.png
          retention-days: 30
