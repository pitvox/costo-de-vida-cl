name: Vista previa del look claro (temporal)

# TEMPORAL: se borra antes de mergear, junto con diseno/vista-previa/.
#
# Arma el sitio con el indices.json publicado en carestia.cl (sin correr
# indices.py), lo sirve en el runner y saca las capturas con Playwright
# (Chromium), con la librería de TradingView que solo existe en Actions.
# Commitea a esta misma rama SOLO los PNG y el LEEME.md de
# diseno/vista-previa/: nunca public/ ni charting_library/. No publica nada:
# sin deploy, sin artefacto de Pages y sin subir public/.
# Los commits del workflow van con GITHUB_TOKEN, que no dispara otra corrida.
on:
  push:
    branches:
      - claude/eloquent-knuth-5hc8qc
    paths-ignore:
      - "diseno/vista-previa/*.png"
      - "diseno/vista-previa/LEEME.md"
  workflow_dispatch:

permissions:
  contents: write

# su propio grupo (nunca "pages"): una corrida nueva reemplaza a la anterior
concurrency:
  group: vista-previa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Sin credenciales persistidas, como en actualizar.yml: el paso de la
      # librería no puede sumar el GITHUB_TOKEN a su encabezado. El push del
      # final pasa el token en un encabezado propio.
      - name: Clonar repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # El mismo paso de actualizar.yml: la librería fuera del árbol
      # (RUNNER_TEMP), el token en un encabezado y solo charting_library/
      # copiada a public/. Si falla, las capturas salen con Lightweight
      # Charts, el LEEME.md lo dice y el workflow termina en rojo.
      - name: Librería TradingView
        id: tv
        shell: bash
        env:
          TV_LIBRARY_TOKEN: ${{ secrets.TV_LIBRARY_TOKEN }}
          TV_LIBRARY_TAG: ${{ vars.TV_LIBRARY_TAG || 'v32.2.0' }}
        run: |
          set -uo pipefail
          DEST="$RUNNER_TEMP/tv"
          PUBLIC="$GITHUB_WORKSPACE/public"
          fallar() {
            echo "::warning::No se pudo descargar la librería de TradingView: $1"
            echo "libreria=falla" >> "$GITHUB_OUTPUT"
            rm -rf "$DEST" "$PUBLIC/charting_library"
            exit 0
          }
          cd "$RUNNER_TEMP" || fallar "no se pudo entrar a RUNNER_TEMP"
          [ -n "$TV_LIBRARY_TOKEN" ] || fallar "falta el secreto TV_LIBRARY_TOKEN"
          auth=$(printf 'x-access-token:%s' "$TV_LIBRARY_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=advice.detachedHead GIT_CONFIG_VALUE_1=false
          REPO=https://github.com/tradingview/charting_library.git
          tag="$TV_LIBRARY_TAG"
          if [ -z "$tag" ]; then
            refs=$(git ls-remote --tags --refs "$REPO") || fallar "no se pudieron leer los tags del repo"
            tag=$(printf '%s\n' "$refs" \
                  | sed -nE 's#.*refs/tags/(v?)([0-9]+(\.[0-9]+)*)$#\2 \1\2#p' \
                  | sort -V | tail -n 1 | cut -d' ' -f2)
            [ -n "$tag" ] || fallar "el repo no tiene tags de versión estable"
          fi
          git clone --quiet --depth 1 --branch "$tag" "$REPO" "$DEST" \
            || fallar "no se pudo clonar el tag $tag"
          [ -f "$DEST/charting_library/charting_library.standalone.js" ] \
            || fallar "el tag $tag no trae charting_library/charting_library.standalone.js"
          mkdir -p "$PUBLIC" || fallar "no se pudo crear la carpeta public"
          cp -r "$DEST/charting_library" "$PUBLIC/charting_library" \
            || fallar "no se pudo copiar charting_library/"
          rm -rf "$DEST"
          echo "libreria=ok" >> "$GITHUB_OUTPUT"
          echo "Librería TradingView $tag en public/charting_library/"

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy requests pillow

      # los datos publicados esta semana, sin correr indices.py
      - name: Datos publicados
        run: curl -fsSO https://carestia.cl/indices.json

      - name: Generar sitio
        run: |
          python build_site.py
          mkdir -p public
          cp index.html public/index.html
          cp graficos.html public/graficos.html
          cp prueba-graficos.html public/prueba-graficos.html
          cp carestia-tv.js public/carestia-tv.js
          cp carestia-tv.css public/carestia-tv.css
          cp carestia-ficha.js public/carestia-ficha.js
          cp carestia-busca.js public/carestia-busca.js
          cp indices.json public/indices.json
          cp resumen.json public/resumen.json
          cp og.png public/og.png
          cp apple-touch-icon.png public/apple-touch-icon.png
          cp robots.txt public/robots.txt
          cp sitemap.xml public/sitemap.xml
          cp metodologia.html public/metodologia.html
          cp acerca.html public/acerca.html
          cp novedades.html public/novedades.html
          cp contacto.html public/contacto.html
          cp terminos.html public/terminos.html
          cp privacidad.html public/privacidad.html
          cp prensa.html public/prensa.html
          cp compras.html public/compras.html
          cp 404.html public/404.html
          cp -r productos public/productos
          cp -r indices public/indices
          cp -r canastas public/canastas
          cp -r og public/og
          cp -r datos public/datos

      - name: Instalar Playwright
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capturas
        env:
          LIBRERIA: ${{ steps.tv.outputs.libreria }}
          COMMIT: ${{ github.sha }}
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          python -m http.server 8000 --directory public > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/ > /dev/null && break; sleep 1; done
          export FECHA="$(TZ=America/Santiago date '+%d-%m-%Y %H:%M') (hora de Chile)"
          node diseno/vista-previa/capturar.js http://localhost:8000 public diseno/vista-previa

      # solo los PNG y el LEEME.md de diseno/vista-previa/; si hay cualquier
      # otra cosa en el índice, no se commitea nada
      - name: Commitear las capturas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- 'diseno/vista-previa/*.png' diseno/vista-previa/LEEME.md
          if git diff --cached --name-only | grep -v '^diseno/vista-previa/'; then
            echo "::error::Hay archivos fuera de diseno/vista-previa/ en el índice"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Vista previa: capturas de ${GITHUB_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Avisar si faltó la librería
        if: ${{ steps.tv.outputs.libreria != 'ok' }}
        run: |
          echo "::error::No se pudo descargar la librería de TradingView: las capturas son de Lightweight Charts"
          exit 1
