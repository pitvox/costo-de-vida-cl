# Bumps de GitHub Actions (checkout, setup-python, upload-pages-artifact,
# deploy-pages, ...) llegan solos como PR. Sin auto-merge: el dueño mergea.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(actions)"
